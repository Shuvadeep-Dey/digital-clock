<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Digital Clock</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <div class="clock-container">
            <h1>Digital Clock</h1>

            <div id="clock">00:00:00</div>

            <div id="date">Loading Date...</div>


            <button id="soundBtn">🔇Tick Sound OFF</button>

            <div class="alarm-section">

                <h2>⏰️Alarm</h2>

                <input type="time" id="alarmTime">

                <div>
                    <button id="setAlarmBtn">Set Alarm</button>
                    <button id="cancelAlarmBtn">Cancel Alarm</button>
                </div>

                <p id="alarmStatus">No alarm set</p>

                <button id="stopAlarmBtn" class="stop-btn">🔔Stop Alarm</button>

            </div>

            </div>

        <script src="script.js"></script>
        
    </body>
</html>
